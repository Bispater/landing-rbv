<div class="page-header">
  <div class="container">
    <h1><i class="fas fa-gavel"></i> Reglamentos</h1>
    <p>Normas internas de funcionamiento de la agrupación</p>
    <div class="gold-line"></div>
  </div>
</div>

<section class="section">
  <div class="container">
    @if (pdfUrl()) {
      <div class="doc-pdf">
        <div class="doc-pdf-head">
          <span><i class="fas fa-file-pdf"></i> Documento oficial (PDF)</span>
          <a [href]="pdfUrl()" target="_blank" rel="noopener" class="btn-primary"><i class="fas fa-external-link-alt"></i> Abrir en pestaña nueva</a>
        </div>
        <iframe [src]="pdfSafe()" title="Documento PDF"></iframe>
      </div>
    }
    <div class="regl-grid">
      @for (reg of reglamentos(); track reg.titulo) {
        <div class="regl-card card">
          <div class="regl-icon">
            <i class="fas" [class]="'fas ' + (reg.icono || 'fa-file-alt')"></i>
          </div>
          <div class="regl-body">
            <h3>{{ reg.titulo }}</h3>
            <ul>
              @for (item of items(reg.contenido); track item) {
                <li><i class="fas fa-check-circle"></i> {{ item }}</li>
              }
            </ul>
          </div>
        </div>
      }
    </div>
  </div>
</section>
