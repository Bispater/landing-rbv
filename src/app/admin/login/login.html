<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo"><img src="assets/images/logopng.png" alt="RBV"></div>
      <h2>Panel Administrativo</h2>
      <p>Reales Brillantes Valparaíso</p>
    </div>

    <form (ngSubmit)="onSubmit()" #f="ngForm" class="login-form">
      @if (error()) {
        <div class="alert-error"><i class="fas fa-exclamation-circle"></i> {{ error() }}</div>
      }

      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Correo electrónico</label>
        <input id="email" type="email" [(ngModel)]="email" name="email"
               placeholder="admin@realesbrillantes.cl" autocomplete="username" required />
      </div>

      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
        <div class="password-wrapper">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" name="password"
                 placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="eye-toggle" (click)="showPassword.set(!showPassword())" tabindex="-1">
            <i class="fas" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="recordarme" [(ngModel)]="recordarme" name="recordarme" />
        <label for="recordarme">Recordarme en este dispositivo</label>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading()">
        @if (loading()) {
          <span class="btn-spinner"></span> Ingresando...
        } @else {
          <i class="fas fa-sign-in-alt"></i> Ingresar
        }
      </button>
    </form>

    <div class="login-footer">
      <a routerLink="/" class="back-link"><i class="fas fa-arrow-left"></i> Volver al sitio</a>
    </div>
  </div>
</div>
